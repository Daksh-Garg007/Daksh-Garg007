name: Generate profile graphs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate self-hosted contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          token=os.environ['GH_TOKEN']; user='Daksh-Garg007'
          def get(url):
              r=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'profile-graphs'})
              with urllib.request.urlopen(r) as x: return json.load(x)
          def esc(s): return str(s).replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('"','&quot;')
          root=Path('assets'); root.mkdir(exist_ok=True)
          u=get(f'https://api.github.com/users/{user}')
          repos=get(f'https://api.github.com/users/{user}/repos?per_page=100&type=owner')
          stars=sum(r.get('stargazers_count',0) for r in repos); forks=sum(r.get('forks_count',0) for r in repos)
          W,H=760,190
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}"><rect width="100%" height="100%" rx="14" fill="#0d1117" stroke="#30363d"/><style>text{{font-family:Arial,sans-serif;fill:#c9d1d9}}.t{{font-size:18px;font-weight:700;fill:#f0f6fc}}.m{{fill:#8b949e;font-size:12px}}</style><text x="24" y="32" class="t">GitHub Statistics</text>'''
          cards=[('Repositories',u.get('public_repos',0)),('Followers',u.get('followers',0)),('Stars',stars),('Forks',forks)]
          for i,(label,val) in enumerate(cards):
              x=24+i*184; svg+=f'<rect x="{x}" y="58" width="164" height="96" rx="10" fill="#161b22" stroke="#30363d"/><text x="{x+14}" y="86" class="m">{esc(label)}</text><text x="{x+14}" y="124" style="font-size:28px;font-weight:700;fill:#a78bfa">{esc(val)}</text>'
          svg+='<text x="24" y="178" class="m">Generated by GitHub Actions · served directly from this repository</text></svg>'
          (root/'github-stats.svg').write_text(svg)

          # Generate a repository-hosted activity calendar using the public contributions API.
          # This intentionally uses GitHub's GraphQL API through the workflow token.
          import urllib.parse
          query='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{totalContributions weeks{contributionDays{date contributionCount contributionLevel}}}}}}'
          today=datetime.now(timezone.utc).date(); start=today-timedelta(days=364)
          body=json.dumps({'query':query,'variables':{'login':user,'from':f'{start}T00:00:00Z','to':f'{today}T23:59:59Z'}}).encode()
          req=urllib.request.Request('https://api.github.com/graphql',data=body,headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','Content-Type':'application/json','User-Agent':'profile-graphs'})
          with urllib.request.urlopen(req) as x: data=json.load(x)
          c=data['data']['user']['contributionsCollection']['contributionCalendar']; days=[d for w in c['weeks'] for d in w['contributionDays']]
          colors={'NONE':'#161b22','FIRST_QUARTILE':'#0e4429','SECOND_QUARTILE':'#006d32','THIRD_QUARTILE':'#26a641','FOURTH_QUARTILE':'#39d353'}
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" width="760" height="160"><rect width="100%" height="100%" rx="14" fill="#0d1117" stroke="#30363d"/><style>text{{font-family:Arial,sans-serif;fill:#c9d1d9}}.t{{font-size:18px;font-weight:700;fill:#f0f6fc}}.m{{fill:#8b949e;font-size:12px}}</style><text x="24" y="32" class="t">Contribution Activity · {c['totalContributions']} contributions</text>'''
          for i,d in enumerate(days):
              x=24+(i//7)*11; y=48+(i%7)*15
              svg+=f'<rect x="{x}" y="{y}" width="9" height="12" rx="2" fill="{colors.get(d["contributionLevel"],colors["NONE"])}"><title>{esc(d["date"])}: {d["contributionCount"]} contributions</title></rect>'
          svg+='</svg>'; (root/'contributions.svg').write_text(svg)
          PY

      - name: Commit generated graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/contributions.svg
          git diff --cached --quiet || git commit -m "chore: update self-hosted GitHub graphs"
          git push
