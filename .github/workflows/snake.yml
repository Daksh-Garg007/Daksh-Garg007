name: Update GitHub Profile Graphics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile graphics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          USER='Daksh-Garg007'; TOKEN=os.environ['GH_TOKEN']; OUT=Path('assets'); OUT.mkdir(exist_ok=True)
          H={'Accept':'application/vnd.github+json','Authorization':f'Bearer {TOKEN}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'daksh-profile'}
          def get(path):
              r=urllib.request.Request('https://api.github.com'+path,headers=H)
              with urllib.request.urlopen(r,timeout=30) as x: return json.load(x)
          def post_graphql(q,v):
              body=json.dumps({'query':q,'variables':v}).encode(); h={**H,'Content-Type':'application/json'}
              r=urllib.request.Request('https://api.github.com/graphql',data=body,headers=h)
              with urllib.request.urlopen(r,timeout=30) as x: return json.load(x)['data']
          def esc(s): return str(s).replace('&','&amp;').replace('<','&lt;').replace('>','&gt;').replace('"','&quot;')
          def base(w,h,title,sub=''):
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}"><rect width="100%" height="100%" rx="16" fill="#0d1117" stroke="#30363d"/><style>text{{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#c9d1d9}}.title{{font-size:18px;font-weight:700;fill:#f0f6fc}}.muted{{font-size:12px;fill:#8b949e}}.value{{font-size:28px;font-weight:700;fill:#a78bfa}}</style><text x="24" y="32" class="title">{esc(title)}</text>{f'<text x="736" y="31" text-anchor="end" class="muted">{esc(sub)}</text>' if sub else ''}'''

          u=get(f'/users/{USER}'); repos=get(f'/users/{USER}/repos?per_page=100&type=owner')
          stars=sum(r.get('stargazers_count',0) for r in repos); forks=sum(r.get('forks_count',0) for r in repos)
          svg=base(760,190,'GitHub Analytics','Live from GitHub API')
          for i,(label,val) in enumerate([('Repositories',u.get('public_repos',0)),('Followers',u.get('followers',0)),('Stars',stars),('Forks',forks)]):
              x=24+i*184; svg+=f'<rect x="{x}" y="58" width="164" height="96" rx="10" fill="#161b22" stroke="#30363d"/><text x="{x+14}" y="86" class="muted">{label}</text><text x="{x+14}" y="124" class="value">{val}</text>'
          svg+='</svg>'; (OUT/'github-stats.svg').write_text(svg)

          # Contribution activity: 52-week heatmap generated from GitHub's GraphQL API.
          today=datetime.now(timezone.utc).date(); start=today-timedelta(days=364)
          q='query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){totalCommitContributions totalIssueContributions totalPullRequestContributions totalPullRequestReviewContributions contributionCalendar{totalContributions weeks{contributionDays{date contributionCount contributionLevel}}}}}}'
          c=post_graphql(q,{'login':USER,'from':f'{start}T00:00:00Z','to':f'{today}T23:59:59Z'})['user']['contributionsCollection']; days=[d for w in c['contributionCalendar']['weeks'] for d in w['contributionDays']]
          levels={'NONE':'#161b22','FIRST_QUARTILE':'#0e4429','SECOND_QUARTILE':'#006d32','THIRD_QUARTILE':'#26a641','FOURTH_QUARTILE':'#39d353'}
          svg=base(760,185,'Contribution Activity',f"{c['contributionCalendar']['totalContributions']} contributions · last 12 months")
          for i,d in enumerate(days):
              x=24+(i//7)*11; y=48+(i%7)*16
              svg+=f'<rect x="{x}" y="{y}" width="9" height="12" rx="2" fill="{levels.get(d["contributionLevel"],levels["NONE"])}"><title>{esc(d["date"])} · {d["contributionCount"]} contributions</title></rect>'
          svg+=f'<text x="24" y="172" class="muted">Commits {c["totalCommitContributions"]} · Issues {c["totalIssueContributions"]} · PRs {c["totalPullRequestContributions"]} · Reviews {c["totalPullRequestReviewContributions"]}</text></svg>'; (OUT/'contributions.svg').write_text(svg)

          # Professional, repository-hosted trophy cards. These are based only on real GitHub account data.
          owned=[r for r in repos if not r.get('fork')]; stars_total=stars
          trophy=[]
          if u.get('public_repos',0)>=1: trophy.append(('FIRST REPO','Builder'))
          if u.get('followers',0)>=10: trophy.append(('10+ FOLLOWERS','Community'))
          if u.get('followers',0)>=50: trophy.append(('50+ FOLLOWERS','Community'))
          if stars_total>=10: trophy.append(('10+ STARS','Open Source'))
          if len(owned)>=10: trophy.append(('10+ REPOS','Builder'))
          if c['totalPullRequestContributions']>=1: trophy.append(('PULL REQUEST','Contributor'))
          if c['totalIssueContributions']>=1: trophy.append(('ISSUE CONTRIBUTOR','Contributor'))
          if c['totalCommitContributions']>=100: trophy.append(('100+ COMMITS','Consistency'))
          trophy=trophy[:6]
          svg=base(760,170,'GitHub Trophies','Earned from GitHub activity')
          for i,(name,kind) in enumerate(trophy):
              x=24+i*122; svg+=f'<rect x="{x}" y="54" width="110" height="88" rx="12" fill="#161b22" stroke="#30363d"/><circle cx="{x+55}" cy="78" r="14" fill="#6d28d9"/><text x="{x+55}" y="84" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#fff">★</text><text x="{x+55}" y="108" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#f0f6fc">{esc(name)}</text><text x="{x+55}" y="124" text-anchor="middle" class="muted">{esc(kind)}</text>'
          svg+='</svg>'; (OUT/'trophies.svg').write_text(svg)

          # Activity trend from the last 30 days, repository-hosted and API-generated.
          events=get(f'/users/{USER}/events/public?per_page=100'); cutoff=today-timedelta(days=29); commits=Counter()
          for e in events:
              d=e.get('created_at','')[:10]
              if d and d>=str(cutoff) and e.get('type')=='PushEvent': commits[d]+=len(e.get('payload',{}).get('commits',[]))
          vals=[commits.get(str(cutoff+timedelta(days=i)),0) for i in range(30)]; mx=max(vals or [1])
          svg=base(760,230,'Contribution Trend','Last 30 days')
          x0,y0,w,h=36,55,690,130
          pts=[]
          for i,v in enumerate(vals):
              x=x0+i*w/29; y=y0+h-(v/mx*h if mx else 0); pts.append(f'{x:.1f},{y:.1f}')
          svg+=f'<polyline points="{" ".join(pts)}" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="{x0}" y1="{y0+h}" x2="{x0+w}" y2="{y0+h}" stroke="#30363d"/>'
          for i,v in enumerate(vals):
              x=x0+i*w/29; y=y0+h-(v/mx*h if mx else 0); svg+=f'<circle cx="{x:.1f}" cy="{y:.1f}" r="2.5" fill="#c4b5fd"><title>{str(cutoff+timedelta(days=i))}: {v} commits</title></circle>'
          svg+=f'<text x="36" y="205" class="muted">Peak daily commits: {mx} · Data generated by GitHub Actions</text></svg>'; (OUT/'activity-trend.svg').write_text(svg)
          PY

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Daksh-Garg007
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Copy snake into repository and commit everything
        run: |
          cp dist/github-contribution-grid-snake.svg assets/github-contribution-grid-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg assets/github-contribution-grid-snake-dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: update GitHub profile graphics"
          git push
